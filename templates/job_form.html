<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    body {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') center/cover;
      color: #fff;
      font-family: 'Arial', sans-serif;
    }
 
  </style>

</head>
<body>
    
{% include "header.html" %}

<div class="register-container">

  <h3><i class="bi bi-pencil-square me-2"></i>{{ title }}</h3>

  <form method="post">
    {% set cats = ['Development', 'Design', 'Marketing', 'Customer Service', 'Finance', 'HR', 'Sales', 'IT Support'] %}

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Job Title</label>
        <input name="title" value="{{ job.title if job }}" class="form-control" placeholder="Enter job title" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Company Name</label>
        <input name="company" value="{{ job.company if job else session['name'] }}" class="form-control" readonly>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Location</label>
        <input name="location" value="{{ job.location if job }}" class="form-control" placeholder="Location">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Salary</label>
        <input name="salary" value="{{ job.salary if job }}" class="form-control" placeholder="Salary">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
          {% for cat in cats %}
            <option  class="bg-dark" value="{{ cat }}" {% if job and job.category == cat %}selected{% endif %} >{{ cat }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6 mb-3 ">
        <label class="form-label ">Job Type</label>
        <select name="job_type" class="form-select ">
          <option class="bg-dark" value="Full Time" {% if job and job.job_type == 'Full Time' %}selected{% endif %}>Full Time</option>
          <option class="bg-dark" value="Part Time" {% if job and job.job_type == 'Part Time' %}selected{% endif %}>Part Time</option>
          <option class="bg-dark" value="Remote" {% if job and job.job_type == 'Remote' %}selected{% endif %}>Remote</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="5" placeholder="Enter job description">{{ job.description if job }}</textarea>
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-success">Save Job</button>
      <a href="/profile" class="btn btn-outline-light">Cancel</a>
    </div>

  </form>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
