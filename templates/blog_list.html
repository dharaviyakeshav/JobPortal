  <link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../static/style.css">

{% include "header.html" %}
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="fw-bold text-center mb-5">Latest News & Career Tips</h2>
    <div class="row g-4">
      {% for blog in blogs %}
      <div class="col-md-4">
        <div class="card h-100 border-0 shadow-sm">
          <img src="../static/{{ blog.image_url }}" class="card-img-top" alt="...">
          <div class="card-body">
            <span class="text-success small fw-bold">{{ blog.category }}</span>
            <h5 class="card-title fw-bold mt-2">{{ blog.title }}</h5>
            <p class="card-text text-muted small">{{ blog.content[:100] }}...</p>
            <a href="/blog/{{ blog.id }}" class="btn btn-outline-success btn-sm">Read More</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% include "footer.html" %}
