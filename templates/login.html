<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Job Portal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">

  <link rel="stylesheet" href="../static/style.css">
  <style>
    body {
      background: linear-gradient(120deg, #000000, #0e3e44);
      color: #fff;
      font-family: 'Arial', sans-serif;
    }
 
  </style>
</head>
<body>
  
{% include "header.html" %}

<div class="register-container">
  <h3>Login to Your Account</h3>
 <form method="POST">
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" name="email" placeholder="Enter email" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
  </div>
  <button type="submit" class="btn btn-register mb-3">Login</button>
  <p class="text-center ">Don't have an account? 
    <a href="{{ url_for('register') }}" class="login-link">Register</a>
  </p>
  <p class="text-center">
  <a href="#" onclick="forgotPasswordModal()" class="login-link" style="font-size: 0.9rem;">Forgot Password?</a>
</p>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Preloader Script -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% if success %}
<script>
Swal.fire({
  icon: 'success',
  title: 'Login Successful!',
  text: 'Welcome back!',
  confirmButtonText: 'Go to Profile',
  background: 'rgba(20,20,20,0.95)',
  color: '#fff'
}).then(() => {
  window.location.href = "{{ url_for('profile') }}";
});
</script>
{% endif %}

{% if error %}
<script>
Swal.fire({
  icon: 'error',
  title: 'Login Failed',
  text: 'Invalid Email or Password',
  confirmButtonColor: '#dc3545',
  background: 'rgba(20,20,20,0.95)',
  color: '#fff'
});
</script>
{% endif %}
<script>
  async function forgotPasswordModal() {
  // 1. Email mangne wala popup
  const { value: email } = await Swal.fire({
    title: 'Reset Password',
    input: 'email',
    inputLabel: 'Enter your registered email',
    inputPlaceholder: 'email@example.com',
    showCancelButton: true,
    confirmButtonColor: '#00c7b7',
    background: 'rgba(20,20,20,0.95)',
    color: '#fff'
  });

  if (email) {
    Swal.showLoading();
    let formData = new FormData();
    formData.append('email', email);

    // Backend se check karna ki email exist karta hai ya nahi
    let response = await fetch('/forgot-password', { method: 'POST', body: formData });
    let result = await response.json();

    if (result.status === 'success') {
      // 2. Password Reset Popup (Isme error aane par popup band nahi hoga)
      const { value: formValues } = await Swal.fire({
        title: 'Security Verification',
        html:
          '<input id="swal-otp" class="swal2-input" placeholder="Enter 6-digit OTP" maxlength="6">' +
          '<div id="password-section" style="opacity: 0.4; pointer-events: none; transition: 0.3s;">' +
            '<hr style="border-color: #555">' +
            '<input id="swal-pass" type="password" class="swal2-input" placeholder="New Password">' +
            '<input id="swal-conf" type="password" class="swal2-input" placeholder="Confirm Password">' +
            '<div style="font-size: 0.75rem; color: #aaa; margin-top: 10px; text-align: left; padding: 0 20px;">' +
              '• Min 8 chars, 1 Uppercase, 1 Special Char (!@#$%^&*)' +
            '</div>' +
          '</div>',
           confirmButtonColor: "#00c7b7", 
        focusConfirm: false,
        background: 'rgba(20,20,20,0.95)',
        color: '#fff',
        didOpen: () => {
          const otpInput = document.getElementById('swal-otp');
          const passSection = document.getElementById('password-section');
          
          otpInput.addEventListener('input', () => {
            if (otpInput.value.length === 6) {
              passSection.style.opacity = "1";
              passSection.style.pointerEvents = "auto";
            } else {
              passSection.style.opacity = "0.4";
              passSection.style.pointerEvents = "none";
            }
          });
        },
        preConfirm: () => {
          const otp = document.getElementById('swal-otp').value;
          const pass = document.getElementById('swal-pass').value;
          const conf = document.getElementById('swal-conf').value;
          const passRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.{8,})/;

          // --- VALIDATION WITHOUT REFRESH ---
          if (!otp || otp.length < 6) {
            Swal.showValidationMessage('Please enter 6-digit OTP');
            return false; // Popup band nahi hoga
          }
          if (!passRegex.test(pass)) {
            Swal.showValidationMessage('Password requirement not met!');
            return false; // Popup band nahi hoga
          }
          if (pass !== conf) {
            Swal.showValidationMessage('Passwords do not match!');
            return false; // Popup band nahi hoga
          }

          return { otp, pass, conf };
        }
      });

      // Agar validation pass ho gayi, tabhi backend ko data bhejenge
      if (formValues) {
        Swal.showLoading();
        let resetData = new FormData();
        resetData.append('otp', formValues.otp);
        resetData.append('password', formValues.pass);
        resetData.append('confirm_password', formValues.conf);

        let resetRes = await fetch('/reset-password', { method: 'POST', body: resetData });
        let resetResult = await resetRes.json();

        if (resetResult.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'Success!',
            text: resetResult.message,
            background: 'rgba(20,20,20,0.95)',
            color: '#fff'
          });
        } else {
          // Agar OTP galat nikla backend par, toh error dikhayega
          Swal.fire({
            icon: 'error',
            title: 'Verification Failed',
            text: resetResult.message,
            background: 'rgba(20,20,20,0.95)',
            color: '#fff'
          });
        }
      }
    } else {
      Swal.fire({
        icon: 'error',
        text: result.message,
        background: 'rgba(20,20,20,0.95)',
        color: '#fff'
      });
    }
  }
}
</script>
</body>
</html>
