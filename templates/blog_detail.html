<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <link rel="stylesheet" href="../static/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

{% include "header.html" %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/blogs">Blogs</a></li>
          <li class="breadcrumb-item active">{{ blog.category }}</li>
        </ol>
      </nav>

      <h1 class="fw-bold mb-3">{{ blog.title }}</h1>
      <div class="d-flex align-items-center mb-4 text-muted">
        <i class="bi bi-person me-2"></i> {{ blog.author }} |
        <i class="bi bi-calendar-event ms-3 me-2"></i> {{ blog.created_at.strftime('%B %d, %Y') }}
      </div>

      <img src="../static/{{ blog.image_url }}" class="img-fluid rounded mb-4 w-100" alt="">
      <div class="blog-content" style="font-size: 1.1rem; line-height: 1.8;">
        {{ blog.content | replace('\n', '<br>') | safe }}
      </div>


      <hr class="my-5">
      <a href="/blogs" class="btn btn-success rounded-pill px-4">Back to All Blogs</a>
    </div>
  </div>
</div>

{% include "footer.html" %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
