<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
    
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <h4>⚙ Admin Panel</h4>

    <a href="{{ url_for('admin_dashboard') }}">📊 Dashboard</a>
    <a href="{{ url_for('admin_users') }}">👥 Users</a>
    <a href="{{ url_for('admin_jobs') }}">💼 Jobs</a>
    <a href="{{ url_for('admin_applications') }}">📄 Applications</a>
    <a href="{{ url_for('admin_blogs') }}">📝 Blogs</a>
    <a href="{{ url_for('admin_feedback') }}">📬 Feedback</a>
     <a href="{{ url_for('admin_reviews') }}">⭐ Reviews</a>
    <a href="{{ url_for('admin_logout') }}">🚪 Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">

    <div class="topbar">
    <div class="d-flex align-items-center gap-3">
        <span class="menu-btn" onclick="toggleSidebar()">☰</span>
        <h5 class="mb-0">Admin Dashboard</h5>
    </div>
    <span class="fw-semibold">
        {{ session['admin'] if 'admin' in session else '' }}
    </span>
</div>
    {% block content %}{% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
    }
</script>

</body>
</html>
