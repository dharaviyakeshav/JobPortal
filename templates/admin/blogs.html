<!DOCTYPE html>
<html lang="en">
<head>
  <title>Manage Blogs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
{% extends "admin/base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="glass-container">
  <div class="admin-card-container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">

       <h2 class="text-center mb-4 text-white">📰 Manage Blogs</h2>
      <a href="/admin/blog/add" class="btn btn-success btn-rounded">+ Post Blog</a>
    </div>

    <div class="table-responsive">
      <table class="table custom-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Blog Title</th>
            <th >Category</th>
            <th>Author</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for b in blogs %}
          <tr>
            <td><img src="../static/{{ b.image_url }}" width="60" class="rounded shadow-sm"></td>
            <td class="fw-bold">{{ b.title }}</td>
            <td>{{ b.category }}</td>
            <td>{{ b.author }}</td>
            <td class="text-center">
              <a href="/admin/blog/delete/{{ b.id }}" onclick="return confirm('Delete this blog?')" class="btn btn-sm btn-danger btn-rounded">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
