<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body>
{% extends "admin/base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="glass-container">
  <div class="admin-card-container" style="max-width: 800px; margin: 40px auto;">
    <h2 class=" mb-4 text-white">{{ title }}</h2>

    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label fw-bold">Blog Title</label>
        <input name="title" class="form-control" required>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Author</label>
          <input name="author" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Category</label>
          <select name="category" class="form-select">
            <option>Career Tips</option>
            <option>Remote Work</option>
            <option>Technology</option>
            <option>Job Interview</option>
          </select>
        </div>
      </div>

      <!-- FILE UPLOAD -->
      <div class="mb-3">
        <label class="form-label fw-bold">Blog Image</label>
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Blog Content</label>
        <textarea name="content" class="form-control" rows="8" required></textarea>
      </div>

      <div class="d-grid">
        <button class="btn btn-success fw-bold py-2">Publish Blog</button>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
