<!DOCTYPE html>
<html lang="en">
<head>
  <title>Manage Jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

</head>

<body>
{% extends "admin/base.html" %}
{% block title %}Page Name{% endblock %}
{% block content %}



<div class="container">
  <div class="admin-card-container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h2 class=" mb-4 text-white">📰 All Jobs</h2>
      
    </div>

    <div class="table-responsive">
      <table class="table custom-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Job & Company</th>
            <th>Category</th>
            <th width="200">Type</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for job in jobs %}
          <tr>
            <td>{{ loop.index }}</td>
            <td><strong>{{ job.title }}</strong><br><small class=" text-white">{{ job.company }}</small></td>
            <td>{{ job.category }}</td>
            <td><span class="badge-custom badge-blue">{{ job.job_type }}</span></td>
            <td class="text-center">
                <a href="/admin/job/delete/{{ job.id }}" onclick="return confirm('Delete?')" class="btn btn-sm btn-danger btn-rounded">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
