<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Profile Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">

  <link rel="stylesheet" href="../static/style.css">
</head>
<body style="background: linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)), url('https://images.unsplash.com/photo-1497366216548-37526070297c') center/cover; color:#fff;">
{% include "header.html" %}

<div class="register-container mt-5">
  <h3>Company Profile Details</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Company Name</label>
      <input type="text" name="company_name" class="form-control" value="{{ company.company_name if company else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Official Website</label>
      <input type="url" name="website" class="form-control" value="{{ company.website if company else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Industry</label>
      <input type="text" name="industry" class="form-control" placeholder="e.g. IT, Healthcare" value="{{ company.industry if company else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Company Description</label>
      <textarea name="description" class="form-control" rows="4">{{ company.description if company else '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Contact Email</label>
      <input type="email" name="contact_email" class="form-control" value="{{ company.contact_email if company else '' }}">
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Company Profile</button>
  </form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
