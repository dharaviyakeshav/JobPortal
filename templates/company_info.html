<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile responsiveness માટે આ viewport ટેગ સૌથી મહત્વનો છે -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Company Profile Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='/favicion.png') }}">

  <link rel="stylesheet" href="../static/style.css">
  
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.75)), 
                  url('https://images.unsplash.com/photo-1497366216548-37526070297c') center/cover no-repeat fixed;
      color: #fff;
      min-height: 100vh;
    }
    
    /* Responsive glassmorphism container */
    .company-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Input elements customization */
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff !important;
      border-radius: 8px;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.25);
      border-color: #0d6efd;
      box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
    }

    .form-control::placeholder {
      color: #ccc;
    }

    /* Small screens tweak */
    @media (max-width: 576px) {
      .company-card {
        padding: 1.5rem 1rem;
        border-radius: 12px;
      }
      h3 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

{% include "header.html" %}

<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
      
      <div class="company-card">
        <h3 class="text-center mb-4 fw-bold">Company Profile Details</h3>
        
        <form method="POST">
          <div class="mb-3">
            <label class="form-label font-weight-bold">Company Name <span class="text-danger">*</span></label>
            <input type="text" name="company_name" class="form-control" placeholder="e.g. Acme Corp" value="{{ company.company_name if company else '' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Official Website</label>
            <input type="url" name="website" class="form-control" placeholder="https://example.com" value="{{ company.website if company else '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Industry</label>
            <input type="text" name="industry" class="form-control" placeholder="e.g. IT, Healthcare" value="{{ company.industry if company else '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Company Description</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Brief about your company...">{{ company.description if company else '' }}</textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">Contact Email</label>
            <input type="email" name="contact_email" class="form-control" placeholder="info@company.com" value="{{ company.contact_email if company else '' }}">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold shadow-sm">Save Company Profile</button>
        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
